<script type="module">
import { calculateStandings } from "./js/standingsEngine.js";

/* ========= 資料來源 ========= */
const LIVE_BOXSCORE_URL = "data/live/live-boxscore.json";

/* ========= DOM ========= */
const standingsWrap = document.getElementById("standingsWrap");
const standingsSummary = document.getElementById("standingsSummary");
const seasonHeading = document.getElementById("seasonHeading");
const seasonSelect  = document.getElementById("seasonSelect");
const splitSelect   = document.getElementById("splitSelect");
const reloadBtn     = document.getElementById("reloadBtn");
const statusText    = document.getElementById("statusText");
const teamSearch    = document.getElementById("teamSearch");
const scrollLeftBtn = document.getElementById("scrollLeftBtn");
const scrollRightBtn = document.getElementById("scrollRightBtn");

/* ========= 狀態 ========= */
let currentSeason = "2026";
let currentSplit  = "full";
let allGames      = [];
let rawStandings  = [];
let validGamesForCurrentView = [];

let sortState = {
  key: "rank",
  dir: "asc"
};

const SEASON_MONTHS = {
  "2026": [
    "2026-03",
    "2026-04",
    "2026-05",
    "2026-06",
    "2026-07",
    "2026-08",
    "2026-09"
  ]
};

const TEAM_ORDER = [
  "味全龍",
  "富邦悍將",
  "台鋼雄鷹",
  "統一7-ELEVEn獅",
  "樂天桃猿",
  "中信兄弟"
];

const TEAM_IDS = {
  "中信兄弟": "brothers",
  "統一7-ELEVEn獅": "lions",
  "樂天桃猿": "monkeys",
  "味全龍": "dragons",
  "富邦悍將": "guardians",
  "台鋼雄鷹": "hawks"
};

/* ========= 工具 ========= */
function setStatus(msg) {
  statusText.textContent = msg;
}

function escapeHtml(str = "") {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function normalizeTeamName(name) {
  return String(name || "")
    .replace("7-ELEVEN", "7-ELEVEn")
    .replace(/\s+/g, "")
    .trim();
}

function resolveTeamId(name) {
  const clean = normalizeTeamName(name).toLowerCase();

  if (clean.includes("中信") || clean.includes("兄弟")) return "brothers";
  if (clean.includes("統一")) return "lions";
  if (clean.includes("樂天") || clean.includes("桃猿")) return "monkeys";
  if (clean.includes("味全") || clean.includes("龍")) return "dragons";
  if (clean.includes("富邦") || clean.includes("悍將")) return "guardians";
  if (clean.includes("台鋼") || clean.includes("雄鷹")) return "hawks";

  return null;
}

function getCanonicalTeamName(name) {
  const id = resolveTeamId(name);

  const map = {
    brothers: "中信兄弟",
    lions: "統一7-ELEVEn獅",
    monkeys: "樂天桃猿",
    dragons: "味全龍",
    guardians: "富邦悍將",
    hawks: "台鋼雄鷹"
  };

  return id ? map[id] : String(name || "");
}

function getSplitName(split) {
  if (split === "first") return "上半季";
  if (split === "second") return "下半季";
  return "全年";
}

function getWinPctClass(pct) {
  if (pct >= 0.6) return "pct-high";
  if (pct >= 0.5) return "pct-mid";
  return "pct-low";
}

function getStreakText(team) {
  if (!team.streakType || !team.streakCount) return "-";

  if (team.streakType === "W") return `勝${team.streakCount}`;
  if (team.streakType === "L") return `敗${team.streakCount}`;
  if (team.streakType === "T") return `和${team.streakCount}`;

  return "-";
}

function getSplitMonths(season, split) {
  const months = SEASON_MONTHS[season] || [];

  if (split === "first") {
    return months.filter(m => Number(m.slice(5, 7)) <= 6);
  }

  if (split === "second") {
    return months.filter(m => Number(m.slice(5, 7)) >= 7);
  }

  return months;
}

function formatRecord(wins = 0, losses = 0, ties = 0) {
  if (ties) return `${wins}-${ties}-${losses}`;
  return `${wins}-${losses}`;
}

function formatPct(pct) {
  return Number(pct || 0).toFixed(3).replace(/^0/, "");
}

function getSortIndicator(key) {
  if (sortState.key !== key) return "";
  return sortState.dir === "asc" ? " ▲" : " ▼";
}

function trendScore(trend) {
  if (trend === "up") return 1;
  if (trend === "flat") return 0;
  return -1;
}

function streakScore(team) {
  if (!team.streakType) return 0;
  if (team.streakType === "W") return team.streakCount;
  if (team.streakType === "L") return -team.streakCount;
  return 0;
}

function sortRows(rows) {
  const sorted = rows.slice();

  sorted.sort((a, b) => {
    let av;
    let bv;

    switch (sortState.key) {
      case "rank": av = a.rank; bv = b.rank; break;
      case "team": av = a.team; bv = b.team; break;
      case "games": av = a.games; bv = b.games; break;
      case "record": av = a.wins - a.losses; bv = b.wins - b.losses; break;
      case "winPct": av = a.winPct; bv = b.winPct; break;
      case "gb": av = a.gb === "-" ? -999 : Number(a.gb); bv = b.gb === "-" ? -999 : Number(b.gb); break;
      case "home": av = a.homeWins / (a.homeWins + a.homeLosses || 1); bv = b.homeWins / (b.homeWins + b.homeLosses || 1); break;
      case "away": av = a.awayWins / (a.awayWins + a.awayLosses || 1); bv = b.awayWins / (b.awayWins + b.awayLosses || 1); break;
      case "last10": av = a.last10Wins - a.last10Losses; bv = b.last10Wins - b.last10Losses; break;
      case "streak": av = streakScore(a); bv = streakScore(b); break;
      case "trend": av = trendScore(a.trend); bv = trendScore(b.trend); break;
      default: av = a.rank; bv = b.rank;
    }

    if (typeof av === "string" && typeof bv === "string") {
      return sortState.dir === "asc"
        ? av.localeCompare(bv, "zh-Hant")
        : bv.localeCompare(av, "zh-Hant");
    }

    return sortState.dir === "asc" ? av - bv : bv - av;
  });

  return sorted;
}

/* ========= 載入 ========= */
async function loadLiveBoxscoreGames() {
  const res = await fetch(`${LIVE_BOXSCORE_URL}?ts=${Date.now()}`, {
    cache: "no-store"
  });

  if (!res.ok) {
    throw new Error(`讀取 live-boxscore.json 失敗：HTTP ${res.status}`);
  }

  const data = await res.json();
  const arr = Array.isArray(data) ? data : Object.values(data || {});

  return arr.map(g => ({
    ...g,
    meta: {
      ...(g.meta || {}),
      home: getCanonicalTeamName(g.meta?.home),
      away: getCanonicalTeamName(g.meta?.away)
    }
  }));
}

/* ========= 核心 ========= */
async function updateStandings() {
  try {
    currentSeason = seasonSelect.value;
    currentSplit = splitSelect.value;

    seasonHeading.textContent = `${currentSeason}年 ${getSplitName(currentSplit)}`;
    setStatus("計算中…");

    allGames = await loadLiveBoxscoreGames();

    const splitMonths = getSplitMonths(currentSeason, currentSplit);

    validGamesForCurrentView = allGames.filter(g => {
      const meta = g.meta || {};
      const month = (meta.date || "").slice(0, 7);
      const homeId = resolveTeamId(meta.home);
      const awayId = resolveTeamId(meta.away);

      return (
        splitMonths.includes(month) &&
        meta.type === "regular" &&
        homeId &&
        awayId
      );
    });

    rawStandings = calculateStandings(validGamesForCurrentView).map(row => ({
      ...row,
      team: getCanonicalTeamName(row.team)
    }));

    renderSummary(rawStandings, validGamesForCurrentView);
    renderWithSearch();

    const finals = validGamesForCurrentView.filter(g => g.meta?.status === "final").length;
    setStatus(`已結束 ${finals} 場｜最後讀取 ${new Date().toLocaleTimeString("zh-TW", { hour12: false })}`);
  } catch (err) {
    console.error(err);
    standingsWrap.innerHTML = `<div class="empty-box">戰績載入失敗</div>`;
    setStatus("戰績載入失敗");
  }
}

function renderSummary(rows, games) {
  const leader = rows[0];
  const hot = rows.slice().sort((a, b) => (b.last10Wins - b.last10Losses) - (a.last10Wins - a.last10Losses))[0];
  const finalCount = games.filter(g => g.meta?.status === "final").length;
  const scheduledCount = games.filter(g => g.meta?.status === "scheduled").length;

  standingsSummary.innerHTML = `
    <div class="standings-summary-item primary">
      <span>目前龍頭</span>
      <strong>${leader ? escapeHtml(leader.team) : "-"}</strong>
      <small>${leader ? `${leader.wins}-${leader.ties}-${leader.losses}｜${formatPct(leader.winPct)}` : "尚無資料"}</small>
    </div>
    <div class="standings-summary-item">
      <span>已完成賽事</span>
      <strong>${finalCount}</strong>
      <small>納入戰績計算</small>
    </div>
    <div class="standings-summary-item">
      <span>未賽事</span>
      <strong>${scheduledCount}</strong>
      <small>不納入戰績</small>
    </div>
    <div class="standings-summary-item hot">
      <span>近期最熱</span>
      <strong>${hot ? escapeHtml(hot.team) : "-"}</strong>
      <small>${hot ? `近十場 ${hot.last10Wins}-${hot.last10Losses}${hot.last10Ties ? `-${hot.last10Ties}` : ""}` : "尚無資料"}</small>
    </div>
  `;
}

function renderWithSearch() {
  const q = teamSearch.value.trim().toLowerCase();

  let rows = rawStandings.slice();

  if (q) {
    rows = rows.filter(t => {
      const name = t.team.toLowerCase();
      const id = resolveTeamId(t.team) || "";
      return name.includes(q) || id.includes(q);
    });
  }

  rows = sortRows(rows);
  renderStandings(rows);
}

/* ========= 顯示 ========= */
function renderStandings(rows) {
  if (!rows.length) {
    standingsWrap.innerHTML = `<div class="empty-box">尚無戰績資料</div>`;
    return;
  }

  const opponentHeads = TEAM_ORDER.map(team => `
    <th class="team-opponent-head">${escapeHtml(team)}</th>
  `).join("");

  standingsWrap.innerHTML = `
    <div class="standings-official-table-wrap" id="standingsTableWrap">
      <table class="standings-table official-style">
        <thead>
          <tr>
            <th class="sortable sticky-col rank-col" data-sort="rank">排名${getSortIndicator("rank")}</th>
            <th class="sortable sticky-col team-col" data-sort="team">球隊${getSortIndicator("team")}</th>
            <th class="sortable" data-sort="games">出賽數${getSortIndicator("games")}</th>
            <th class="sortable" data-sort="record">勝-和-敗${getSortIndicator("record")}</th>
            <th class="sortable" data-sort="winPct">勝率${getSortIndicator("winPct")}</th>
            <th class="sortable" data-sort="gb">勝差${getSortIndicator("gb")}</th>
            <th>淘汰指數</th>
            ${opponentHeads}
            <th class="sortable" data-sort="home">主場戰績${getSortIndicator("home")}</th>
            <th class="sortable" data-sort="away">客場戰績${getSortIndicator("away")}</th>
            <th class="sortable" data-sort="streak">連勝/連敗${getSortIndicator("streak")}</th>
            <th class="sortable" data-sort="last10">近十場${getSortIndicator("last10")}</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(t => renderRow(t)).join("")}
        </tbody>
      </table>
    </div>
    <div class="standings-note official-note">
      提示：資料由本站 <code>live-boxscore.json</code> 自動換算；點擊球隊列可進入球隊頁。對戰欄位格式為「勝-和-敗」。
    </div>
  `;

  standingsWrap.querySelectorAll(".standings-row").forEach(row => {
    row.addEventListener("click", () => {
      const teamId = row.dataset.team;
      if (!teamId) return;
      location.href = `team.html?team=${teamId}`;
    });
  });

  standingsWrap.querySelectorAll(".sortable").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.sort;
      if (!key) return;

      if (sortState.key === key) {
        sortState.dir = sortState.dir === "asc" ? "desc" : "asc";
      } else {
        sortState.key = key;
        sortState.dir = key === "team" || key === "rank" ? "asc" : "desc";
      }

      renderWithSearch();
    });
  });
}

function renderRow(t) {
  const teamId = resolveTeamId(t.team);
  const logo = teamId ? `assets/logo/${teamId}.png` : "assets/logo/cpbl.png";

  const h2hCells = TEAM_ORDER.map(opponent => {
    if (opponent === t.team) return `<td class="h2h-self"></td>`;
    const record = t.h2h?.[opponent] || { wins: 0, losses: 0, ties: 0 };
    return `<td>${formatRecord(record.wins, record.losses, record.ties)}</td>`;
  }).join("");

  const streak = getStreakText(t);
  const streakClass = t.streakType === "W" ? "win" : t.streakType === "L" ? "loss" : "tie";

  return `
    <tr class="standings-row" data-team="${escapeHtml(teamId || "")}">
      <td class="sticky-col rank-col"><span class="standings-rank">${t.rank}</span></td>
      <td class="sticky-col team-col">
        <div class="standings-team official-team-cell">
          <img src="${escapeHtml(logo)}" alt="${escapeHtml(t.team)}">
          <strong>${escapeHtml(t.team)}</strong>
        </div>
      </td>
      <td>${t.games}</td>
      <td>${formatRecord(t.wins, t.losses, t.ties)}</td>
      <td class="${getWinPctClass(t.winPct)}">${formatPct(t.winPct)}</td>
      <td>${escapeHtml(t.gb)}</td>
      <td>${escapeHtml(t.elimination || (t.rank === 1 ? "-" : "E"))}</td>
      ${h2hCells}
      <td>${formatRecord(t.homeWins, t.homeLosses, t.homeTies)}</td>
      <td>${formatRecord(t.awayWins, t.awayLosses, t.awayTies)}</td>
      <td><span class="streak ${streakClass}">${escapeHtml(streak)}</span></td>
      <td>
        <div class="last10-wrap">
          <span class="last10-summary">${t.last10Wins}-${t.last10Losses}${t.last10Ties ? `-${t.last10Ties}` : ""}</span>
          <span class="last10-seq">${escapeHtml(t.last10Display)}</span>
        </div>
      </td>
    </tr>
  `;
}

/* ========= 事件 ========= */
reloadBtn.addEventListener("click", updateStandings);
seasonSelect.addEventListener("change", updateStandings);
splitSelect.addEventListener("change", updateStandings);
teamSearch.addEventListener("input", renderWithSearch);

scrollLeftBtn.addEventListener("click", () => {
  const wrap = document.getElementById("standingsTableWrap");
  wrap?.scrollBy({ left: -420, behavior: "smooth" });
});

scrollRightBtn.addEventListener("click", () => {
  const wrap = document.getElementById("standingsTableWrap");
  wrap?.scrollBy({ left: 420, behavior: "smooth" });
});

/* ========= 啟動 ========= */
updateStandings();
</script>
