name: Sync CPBL Next-Day Pregame

concurrency:
  group: cpbl-data-write
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    # 台灣時間 22:40：比賽日尾聲再抓一次隔日預告先發。
    - cron: "40 14 * * *"

permissions:
  contents: write

jobs:
  sync-next-pregame:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch tomorrow probable starters
        run: node scripts/fetch-cpbl-pregame-today.js --tomorrow
        env:
          CI: true

      - name: Run release gate
        run: node scripts/release-gate.js --live-update

      - name: Commit next-day pregame data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live/live-boxscore.json data/live/probable-pitchers.json data/live/pregame-*.json
          if git diff --cached --quiet; then
            echo "No next-day pregame changes to commit."
          else
            git commit -m "auto sync CPBL next-day probable starters"
            git push
          fi
