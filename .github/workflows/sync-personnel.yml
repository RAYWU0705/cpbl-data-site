name: Sync CPBL Rosters and Transactions

concurrency:
  group: cpbl-data-write
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    # 台灣時間 11:20、16:20：同步六隊一二軍名單與官方球員異動。
    - cron: "20 3 * * *"
    - cron: "20 8 * * *"

permissions:
  contents: write

jobs:
  sync-personnel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync official rosters and transactions
        id: personnel
        continue-on-error: true
        run: npm run sync:personnel
        env:
          CI: true

      - name: Run release gate
        run: node scripts/release-gate.js --live-update

      - name: Commit personnel data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rosters/*.json
          if git diff --cached --quiet; then
            echo "No roster/transaction changes to commit."
          else
            git commit -m "auto sync CPBL rosters and transactions"
            git push
          fi

      - name: Mark degraded personnel sync as failed
        if: steps.personnel.outcome == 'failure'
        run: |
          echo "One or more team sources failed. Cached roster/transaction data was preserved."
          exit 1
