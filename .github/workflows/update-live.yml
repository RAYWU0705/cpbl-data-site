name: Update CPBL Live Data

concurrency:
  group: cpbl-live-update
  cancel-in-progress: false

on:
  workflow_dispatch:

  schedule:
  # 每 5 分鐘觸發；preflight 會在非比賽窗口略過重型步驟。
  - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Decide whether LIVE crawler should run
        id: preflight
        run: node scripts/should-run-live-update.js
        env:
          CPBL_FORCE_LIVE_UPDATE: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Install dependencies
        if: steps.preflight.outputs.should_run == 'true'
        run: npm ci

      - name: Check Puppeteer
        if: steps.preflight.outputs.should_run == 'true'
        run: |
          node -e "import('puppeteer').then(()=>console.log('puppeteer ok')).catch(e=>{console.error(e);process.exit(1)})"

      - name: Update CPBL live data
        if: steps.preflight.outputs.should_run == 'true'
        run: node scripts/fetch-cpbl-live-inplay-today.js
        env:
          CI: true

      - name: Run release gate
        if: steps.preflight.outputs.should_run == 'true'
        run: node scripts/release-gate.js --live-update

      - name: Commit and push live data
        if: steps.preflight.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/live/live-boxscore.json

          if git diff --cached --quiet; then
            echo "No live data changes to commit."
          else
            git commit -m "auto scheduled live update"
            git push
          fi
